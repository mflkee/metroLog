repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: bash -c "cd backend && uv run ruff check ."
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format check (backend)
        entry: bash -c "cd backend && uv run ruff format --check ."
        language: system
        types: [python]
        pass_filenames: false
      - id: eslint-frontend
        name: eslint (frontend)
        entry: npm run lint:frontend
        language: system
        pass_filenames: false
