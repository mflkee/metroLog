name: Deploy to mkair-server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, mkair]
    steps:
      - name: Pull latest code
        run: |
          cd ~/apps/metroLog
          git fetch origin
          git reset --hard origin/main

      - name: Backup
        run: |
          cd ~/apps/metroLog
          ./scripts/docker/backup.sh

      - name: Build & deploy
        run: |
          cd ~/apps/metroLog
          docker compose up -d --build

      - name: Health check
        run: |
          sleep 5
          curl -fsS http://127.0.0.1:8000/api/v1/health

      - name: Show status
        if: always()
        run: |
          cd ~/apps/metroLog
          docker compose ps
