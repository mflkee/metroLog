name: Promote metroLog (staging -> prod)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Образ для прода (staging = текущий стейдж, sha-<hash> = откат)'
        required: false
        default: 'staging'

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: [self-hosted, mkair]
    environment: production
    steps:
      - name: Pull repo code
        run: |
          mkdir -p ~/apps ~/.backups
          cd ~/apps/metroLog || git clone git@github.com:mflkee/metroLog.git ~/apps/metroLog
          cd ~/apps/metroLog
          if [ -f .env ]; then cp .env ~/.backups/metrolog_env_prod_$(date +%Y%m%d_%H%M%S).bak; fi
          git fetch origin && git reset --hard origin/main
          if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || true; fi
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backup DB
        run: |
          mkdir -p ~/.backups
          cd ~/apps/metroLog
          docker compose exec -T postgres pg_dump -U metrolog metrolog > ~/.backups/metroLog_db_promote_$(date +%Y%m%d_%H%M%S).sql
      - name: Promote (same image, tag=${{ inputs.tag }})
        run: |
          cd ~/apps/metroLog
          IMAGE_TAG=${{ inputs.tag }} docker compose pull
          IMAGE_TAG=${{ inputs.tag }} docker compose up -d
      - name: Prod health
        run: |
          for _ in {1..60}; do
            curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null 2>&1 && { echo PROD_OK; exit 0; }
            sleep 2
          done
          echo PROD_FAIL; exit 1