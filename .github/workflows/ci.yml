name: CI metroLog — build GHCR & deploy
on:
  push:
    branches: [main, release/*]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-images:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.tag.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute tags
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "env=latest" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Login GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: |
          docker buildx create --name ghcr-${{ github.run_id }} --driver docker-container --use 2>/dev/null || true
      - name: Build & push backend
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          builder: ghcr-${{ github.run_id }}
          tags: |
            ghcr.io/mflkee/metrolog-backend:sha-${{ steps.tag.outputs.sha }}
            ghcr.io/mflkee/metrolog-backend:${{ steps.tag.outputs.env }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          builder: ghcr-${{ github.run_id }}
          build-args: VITE_API_BASE_URL=/api/v1
          tags: |
            ghcr.io/mflkee/metrolog-frontend:sha-${{ steps.tag.outputs.sha }}
            ghcr.io/mflkee/metrolog-frontend:${{ steps.tag.outputs.env }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Lint and tests gate every deploy: previously the pipeline only built images, so a change
  # that broke the test suite still shipped. Runs on GitHub-hosted runners to keep the app
  # host free.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Backend lint
        run: uv run --directory backend ruff check .
      - name: Backend tests
        run: uv run --directory backend pytest --cov=app --cov-report=term-missing:skip-covered
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        run: npm ci --prefix frontend
      - name: Frontend lint
        run: npm --prefix frontend run lint
      - name: Frontend tests
        run: npm --prefix frontend run test -- --run

  # Fail fast with a clear message when the self-hosted runner that executes the
  # deploy jobs is offline, instead of letting the deploy job fail to start with
  # no explanation. Waits up to ~10 minutes for the runner to come back.
  runner-preflight:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the self-hosted runner
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          if [ -z "${RUNNER_STATUS_TOKEN:-}" ]; then
            echo "::warning::RUNNER_STATUS_TOKEN secret is not set; skipping runner preflight"
            exit 0
          fi
          for attempt in $(seq 1 20); do
            status=$(curl -fsS --max-time 30 \
              -H "Authorization: Bearer ${RUNNER_STATUS_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners?name=mkair-runner" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); rs=[r for r in d.get('runners',[]) if r.get('name')=='mkair-runner']; print(rs[0].get('status','unknown') if rs else 'unknown')" 2>/dev/null || echo unknown)
            echo "attempt ${attempt}: runner mkair-runner status=${status}"
            if [ "${status}" = "online" ]; then
              echo "runner is online"
              exit 0
            fi
            sleep 30
          done
          echo "::error::self-hosted runner 'mkair-runner' is offline; deploy cannot start"
          exit 1

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: [checks, build-images, runner-preflight]
    runs-on: [self-hosted, mkair]
    environment: staging
    steps:
      - name: Pull repo code
        run: |
          mkdir -p ~/apps ~/.backups
          cd ~/apps/metroLog || git clone git@github.com:mflkee/metroLog.git ~/apps/metroLog
          cd ~/apps/metroLog
          if [ -f .env ]; then cp .env ~/.backups/metrolog_env_stg_$(date +%Y%m%d_%H%M%S).bak; fi
          git fetch origin && git reset --hard origin/main
          if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || true; fi
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy staging (pull images)
        run: |
          cd ~/apps/metroLog
          POSTGRES_STG_PORT=5439 IMAGE_TAG=staging docker compose -p metrolog-stg -f docker-compose.staging.yml pull
          POSTGRES_STG_PORT=5439 IMAGE_TAG=staging docker compose -p metrolog-stg -f docker-compose.staging.yml up -d
      - name: Staging health
        run: |
          for _ in {1..60}; do
            curl -fsS http://127.0.0.1:9000/api/v1/health/ready >/dev/null 2>&1 && { echo STAGING_OK; exit 0; }
            sleep 2
          done
          echo STAGING_FAIL; exit 1

  deploy-prod:
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: [checks, build-images, runner-preflight]
    runs-on: [self-hosted, mkair]
    environment: production
    steps:
      - name: Pull repo code
        run: |
          mkdir -p ~/apps ~/.backups
          cd ~/apps/metroLog || git clone git@github.com:mflkee/metroLog.git ~/apps/metroLog
          cd ~/apps/metroLog
          if [ -f .env ]; then cp .env ~/.backups/metrolog_env_prod_$(date +%Y%m%d_%H%M%S).bak; fi
          git fetch origin && git reset --hard origin/${{ github.ref_name }}
          if [ ! -f .env ]; then cp .env.example .env 2>/dev/null || true; fi
      - name: Backup DB
        run: |
          mkdir -p ~/.backups
          cd ~/apps/metroLog
          docker compose exec -T postgres pg_dump -U metrolog metrolog > ~/.backups/metroLog_db_$(date +%Y%m%d_%H%M%S).sql
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy prod (pull images)
        run: |
          cd ~/apps/metroLog
          IMAGE_TAG=latest docker compose pull
          IMAGE_TAG=latest docker compose up -d
      - name: Prod health
        run: |
          for _ in {1..60}; do
            curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null 2>&1 && { echo PROD_OK; exit 0; }
            sleep 2
          done
          echo PROD_FAIL; exit 1