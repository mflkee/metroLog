name: Deploy to mkair-server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, mkair]
    steps:
      - name: Pull latest code
        run: |
          cd ~/apps/metroLog
          git fetch origin
          git reset --hard origin/main

      - name: Backup
        run: |
          cd ~/apps/metroLog
          ./scripts/docker/backup.sh

      - name: Build & deploy
        run: |
          cd ~/apps/metroLog
          docker compose up -d --build

      - name: Health check
        run: |
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to become ready within 30s"
          exit 1

      - name: Show status
        if: always()
        run: |
          cd ~/apps/metroLog
          docker compose ps
