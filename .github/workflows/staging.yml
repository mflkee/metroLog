name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: [self-hosted, mkair]
    environment: staging
    steps:
      - name: Checkout staging code
        run: |
          cd ~/apps/metroLog
          # Сохраняем .env перед git reset --hard
          if [ -f .env ]; then
            cp .env /tmp/metrolog_env_backup
            echo 'Backed up .env'
          fi
          git fetch origin
          git reset --hard origin/main
          # Восстанавливаем .env
          if [ -f /tmp/metrolog_env_backup ]; then
            cp /tmp/metrolog_env_backup .env
            echo 'Restored .env from backup'
          else
            echo 'WARNING: no .env found'
          fi
          # Защита от accidental commit
          if ! grep -q '^\.env$' .gitignore 2>/dev/null; then
            echo '.env' >> .gitignore
          fi
          

      - name: Build & deploy staging
        run: |
          cd ~/apps/metroLog
          # ВАЖНО: -p metrolog-stg обязателен! Без него project name = 'metrolog'
          # (по имени папки) совпадает с продом, и compose пересоздаёт прод-контейнеры.
          # POSTGRES_STG_PORT=5439 потому что дефолт 5436 занят metroCheck_postgres_stg.
          POSTGRES_STG_PORT=5439 docker compose -p metrolog-stg -f docker-compose.staging.yml up -d --build

      - name: Staging health check
        run: |
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/api/v1/health/ready >/dev/null 2>&1; then
              echo 'Staging backend is ready'
              exit 0
            fi
            sleep 1
          done
          echo 'Staging backend failed to become ready within 30s'
          exit 1

      - name: Show staging status
        if: always()
        run: |
          cd ~/apps/metroLog
          docker compose -p metrolog-stg -f docker-compose.staging.yml ps
