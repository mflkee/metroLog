<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="shortcut icon" href="/favicon.ico?v=m-v1" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=m-v1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=m-v1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=m-v1" />
    <title>metroLog</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /*
       * Apply the theme before the bundle loads so a dark-by-default start does not flash light.
       * Keep the key and the default in sync with frontend/src/store/theme.ts.
       */
      (function () {
        var known = [
          "light", "dark", "gray", "tokyonight", "catppuccin",
          "kanagawa", "nord", "dracula", "gruvbox", "moonfly",
        ];
        try {
          var stored = window.localStorage.getItem("metrolog.theme");
          var theme = known.indexOf(stored) >= 0 ? stored : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === "light" || theme === "gray" ? "light" : "dark";
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
